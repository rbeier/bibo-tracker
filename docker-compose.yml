services:
  server:
    restart: always
    build:
      context: .
      dockerfile: src/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - API_KEY=${API_KEY:-}
      - DATABASE_PATH=/app/data/bibo.sqlite
    volumes:
      - ./data:/app/data
    ports:
      - "${PORT:-3000}:3000"
